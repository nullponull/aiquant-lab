[project]
name = "aiquant-lab"
version = "0.1.0"
description = "AIで投資の壁を越える — 市場予測の限界を実装で検証する公開研究"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scipy>=1.17.1",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
