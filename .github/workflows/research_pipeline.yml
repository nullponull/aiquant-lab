name: Research Pipeline (weekly)

# この環境ではローカルから市場データへ接続できないため、
# 実データでの Phase 2-3 評価は GitHub Actions 上で実行し、
# レポートとデータスナップショットをリポジトリにコミットする。

on:
  schedule:
    - cron: "0 22 * * 1"   # 毎週月曜 22:00 UTC (火曜朝 JST、米国市場クローズ後)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Phase 2-3 pipeline
        run: uv run python code/experiments/run_phase234_pipeline.py

      - name: Run significance audit
        run: uv run python code/experiments/run_significance_audit.py

      - name: Commit results and data snapshots
        run: |
          git config user.name "research-bot"
          git config user.email "actions@github.com"
          git add results/ data/cache/ || true
          git diff --cached --quiet || git commit -m "research: weekly pipeline $(date -u +%F)"
          git push
